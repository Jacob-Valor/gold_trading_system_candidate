name: gold-trading-system

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    pull_policy: missing
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    # No host port mapping: the DB is only reachable inside the compose network.
    # (System Postgres owns localhost:5432 for local dev.)
    # PG18+ image convention: mount the volume at /var/lib/postgresql (data lives in a subdir).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs schema migrations + the idempotent seed, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    pull_policy: missing
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}"
      SEED_USER_EMAIL: "${SEED_USER_EMAIL:?Set SEED_USER_EMAIL in .env}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:?Set SEED_USER_PASSWORD in .env}"
      GOLD_PRICE_USD: "${GOLD_PRICE_USD:-125.42}"
    depends_on:
      db:
        condition: service_healthy

  # Removes disposable integration data from a local Compose database.
  cleanup:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    pull_policy: missing
    command: npx tsx scripts/cleanup-test-data.ts --all
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    pull_policy: missing
    # No host port mapping needed unless you want redis-cli locally; internal only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    pull_policy: missing
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-24h}"
      GOLD_PRICE_USD: "${GOLD_PRICE_USD:-125.42}"
      PRICE_WALKER_ENABLED: "${PRICE_WALKER_ENABLED:-false}"
      ALLOW_SIMULATED_DEPOSITS: "${ALLOW_SIMULATED_DEPOSITS:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/price').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  edge:
    image: caddy:2.10-alpine
    profiles: ["production"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config: